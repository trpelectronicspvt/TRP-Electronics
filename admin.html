<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRP Electronics - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .box { width: 100%; max-width: 960px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin: 0; }
    
    .login-container { max-width: 400px; margin: 60px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
    input, select, textarea { width: 100%; padding: 10px 14px; margin: 8px 0 14px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 16px; }
    .add-btn { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .add-btn:hover { background: #0369a1; }
    .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 8px 14px; border-radius: 6px; cursor: pointer; }

    /* Admin Filter Controls Bar */
    .controls-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .controls-bar input { margin: 0; flex: 2; min-width: 200px; }
    .controls-bar select { margin: 0; flex: 1; min-width: 150px; }

    /* Product Rows */
    .product-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 12px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #1e293b; gap: 14px; flex-wrap: wrap; }
    .row-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 260px; }
    .row-img { width: 50px; height: 50px; border-radius: 6px; object-fit: contain; background: #fff; padding: 2px; }
    .badge { background: #16a34a; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px; }
    .pdf-badge { background: #3b82f6; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    
    .row-actions { display: flex; align-items: center; gap: 10px; }
    .edit-btn { background: #eab308; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .del-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .stock-toggle { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; user-select: none; }

    /* Modal Form */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: #1e293b; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 24px; border-radius: 12px; border: 1px solid #475569; position: relative; }
    .close-modal { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    
    .preview-frame { width: 100%; height: 130px; background: #0b1120; border: 2px dashed #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; overflow: hidden; }
    .preview-frame img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-container">
    <h2 style="text-align: center; margin-bottom: 20px;">TRP Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Admin Email" />
    <input type="password" id="adminPass" placeholder="Password" />
    <button id="loginBtn" class="add-btn" style="width:100%; justify-content:center; padding:12px;">Login to Panel</button>
  </div>

  <!-- INVENTORY DASHBOARD -->
  <div id="adminScreen" class="box" style="display: none;">
    <div class="top-bar">
      <div>
        <h2>Store Inventory</h2>
        <span id="totalItems" style="font-size: 13px; color: #94a3b8;">0 Components Live</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="openModalBtn" class="add-btn">➕ Add Product</button>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>

    <!-- Enhanced Control Bar -->
    <div class="controls-bar">
      <input type="text" id="adminSearch" placeholder="🔍 Search component by name or keyword..." />
      <select id="adminCatFilter">
        <option value="all">All Categories</option>
        <option value="Resistor">Resistor</option>
        <option value="LED">LED</option>
        <option value="IC">IC</option>
        <option value="Sensor">Sensor</option>
        <option value="Wire">Wire</option>
        <option value="Supply">Supply</option>
        <option value="Switch">Switch</option>
        <option value="Projects">Projects</option>
        <option value="More">More</option>
      </select>
    </div>

    <div id="liveList">Loading inventory...</div>
  </div>

  <!-- POPUP MODAL (ADD / EDIT) -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <button id="closeFormBtn" class="close-modal">✕</button>
      <h3 id="formTitle" style="color: #38bdf8; margin-top: 0;">Add Component</h3>
      
      <form id="productForm">
        <input type="hidden" id="editDocId" value="" />

        <label style="font-size:12px; color:#94a3b8;">Component Name:</label>
        <input type="text" id="pName" placeholder="e.g. NE555 Timer IC" required />

        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label style="font-size:12px; color:#94a3b8;">Price (₹):</label>
            <input type="number" id="pPrice" placeholder="Price in ₹" required />
          </div>
          <div style="flex: 1;">
            <label style="font-size:12px; color:#94a3b8;">Stock Qty (Pcs):</label>
            <input type="number" id="pQty" placeholder="e.g. 50" value="10" />
          </div>
          <div style="flex: 1;">
            <label style="font-size:12px; color:#94a3b8;">Offer Badge:</label>
            <input type="text" id="pOffer" placeholder="e.g. 5% OFF" />
          </div>
        </div>

        <label style="font-size:12px; color:#94a3b8;">Category:</label>
        <select id="pCategory" required>
          <option value="Resistor">Resistor</option>
          <option value="LED">LED</option>
          <option value="IC">IC</option>
          <option value="Sensor">Sensor</option>
          <option value="Wire">Wire</option>
          <option value="Supply">Supply</option>
          <option value="Switch">Switch</option>
          <option value="Projects">Projects</option>
          <option value="More">More</option>
        </select>

        <!-- Image Options -->
        <label style="font-size:12px; color:#94a3b8;">Image: Upload File OR Link</label>
        <input type="file" id="pFile" accept="image/*" />
        <input type="text" id="pUrl" placeholder="Or enter URL: images/ne555.png / https://..." />

        <div class="preview-frame">
          <img id="imagePreview" src="images/all.png" alt="Preview Image" />
        </div>

        <!-- Datasheet Options -->
        <label style="font-size:12px; color:#38bdf8; font-weight: bold;">Datasheet PDF: Direct Upload OR Link</label>
        <input type="file" id="pPdfFile" accept="application/pdf" />
        <input type="text" id="pPdfUrl" placeholder="Or PDF Link: datasheets/ne555.pdf / https://..." />
        <span id="pdfNotice" style="font-size: 11px; color: #94a3b8; display: block; margin-top: -8px; margin-bottom: 12px;"></span>

        <label style="font-size:12px; color:#94a3b8;">Search Keywords:</label>
        <input type="text" id="pKeywords" placeholder="ne555 timer 8pin ic dip" />

        <label style="font-size:12px; color:#94a3b8;">Description:</label>
        <textarea id="pDesc" rows="3" placeholder="Enter specifications..."></textarea>

        <button type="submit" id="saveBtn" class="add-btn" style="width: 100%; justify-content: center; padding: 12px;">Save Component</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "./firebase-config.js";

    const loginScreen = document.getElementById("loginScreen");
    const adminScreen = document.getElementById("adminScreen");
    const productModal = document.getElementById("productModal");
    const pFile = document.getElementById("pFile");
    const pUrl = document.getElementById("pUrl");
    const pPdfFile = document.getElementById("pPdfFile");
    const pPdfUrl = document.getElementById("pPdfUrl");
    const pdfNotice = document.getElementById("pdfNotice");
    const imagePreview = document.getElementById("imagePreview");
    
    let currentImageBase64 = "";
    let currentPdfBase64 = "";
    let cachedProducts = [];

    // Auth Login
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("adminEmail").value.trim();
      const pass = document.getElementById("adminPass").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.style.display = "none";
        adminScreen.style.display = "block";
        loadProducts();
      } else {
        loginScreen.style.display = "block";
        adminScreen.style.display = "none";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    // Modal Triggers
    document.getElementById("openModalBtn").addEventListener("click", () => {
      document.getElementById("productForm").reset();
      document.getElementById("editDocId").value = "";
      document.getElementById("formTitle").textContent = "Add Component";
      imagePreview.src = "images/all.png";
      currentImageBase64 = "";
      currentPdfBase64 = "";
      pdfNotice.textContent = "";
      productModal.classList.add("active");
    });
    document.getElementById("closeFormBtn").addEventListener("click", () => productModal.classList.remove("active"));

    // Image File Reader
    pFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          currentImageBase64 = evt.target.result;
          imagePreview.src = currentImageBase64;
          pUrl.value = "";
        };
        reader.readAsDataURL(file);
      }
    });
    pUrl.addEventListener("input", (e) => {
      if (e.target.value.trim()) {
        currentImageBase64 = "";
        imagePreview.src = e.target.value.trim();
      }
    });

    // PDF Datasheet File Reader
    pPdfFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 1048576) { // 1MB limit for firestore document safety
          alert("⚠️ PDF file is too large for direct upload. Please keep under 1MB or use a URL link.");
          pPdfFile.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = (evt) => {
          currentPdfBase64 = evt.target.result;
          pdfNotice.textContent = `✔ Selected: ${file.name} (Ready to save)`;
          pPdfUrl.value = "";
        };
        reader.readAsDataURL(file);
      }
    });
    pPdfUrl.addEventListener("input", (e) => {
      if (e.target.value.trim()) {
        currentPdfBase64 = "";
        pdfNotice.textContent = "✔ Link set";
      }
    });

    // Load & Render Products
    async function loadProducts() {
      const liveList = document.getElementById("liveList");
      liveList.innerHTML = "<p style='color:#94a3b8;'>Loading inventory...</p>";
      const snap = await getDocs(collection(db, "products"));
      cachedProducts = [];
      snap.forEach(d => cachedProducts.push({ id: d.id, ...d.data() }));
      renderFilteredProducts();
    }

    function renderFilteredProducts() {
      const liveList = document.getElementById("liveList");
      const search = document.getElementById("adminSearch").value.toLowerCase().trim();
      const cat = document.getElementById("adminCatFilter").value;

      const filtered = cachedProducts.filter(item => {
        const matchesCat = (cat === "all" || item.category === cat);
        const matchesSearch = !search || 
          (item.name || "").toLowerCase().includes(search) || 
          (item.keywords || "").toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      document.getElementById("totalItems").textContent = `${filtered.length} Components Showing`;
      liveList.innerHTML = "";

      if (filtered.length === 0) {
        liveList.innerHTML = "<p style='color:#94a3b8;'>No matching products found.</p>";
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement("div");
        row.className = "product-row";
        row.innerHTML = `
          <div class="row-info">
            <img src="${item.image || 'images/all.png'}" class="row-img" />
            <div>
              <strong>${item.name}</strong>
              ${item.offer ? `<span class="badge">${item.offer}</span>` : ''}
              ${(item.datasheet) ? `<span class="pdf-badge">PDF 📄</span>` : ''}
              <div style="font-size:13px; color:#94a3b8;">
                ₹${item.price} | Stock: <strong>${item.qty ?? 'N/A'}</strong> | Cat: ${item.category}
              </div>
            </div>
          </div>
          <div class="row-actions">
            <label class="stock-toggle">
              <input type="checkbox" class="outStockCheck" data-id="${item.id}" ${item.outOfStock ? 'checked' : ''}>
              Out of Stock
            </label>
            <button class="edit-btn" data-id="${item.id}">✏️ Edit</button>
            <button class="del-btn" data-id="${item.id}">🗑️</button>
          </div>
        `;
        liveList.appendChild(row);
      });

      // Bind Listeners
      document.querySelectorAll(".outStockCheck").forEach(chk => {
        chk.onchange = async (e) => {
          await updateDoc(doc(db, "products", e.target.dataset.id), {
            outOfStock: e.target.checked
          });
          const target = cachedProducts.find(x => x.id === e.target.dataset.id);
          if (target) target.outOfStock = e.target.checked;
        };
      });

      document.querySelectorAll(".del-btn").forEach(btn => {
        btn.onclick = async () => {
          if (confirm("Delete this component permanently?")) {
            await deleteDoc(doc(db, "products", btn.dataset.id));
            loadProducts();
          }
        };
      });

      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.onclick = () => {
          const docId = btn.dataset.id;
          const data = cachedProducts.find(x => x.id === docId);
          if (data) {
            document.getElementById("editDocId").value = docId;
            document.getElementById("pName").value = data.name || "";
            document.getElementById("pPrice").value = data.price || "";
            document.getElementById("pQty").value = data.qty ?? 10;
            document.getElementById("pOffer").value = data.offer || "";
            document.getElementById("pCategory").value = data.category || "More";
            document.getElementById("pKeywords").value = data.keywords || "";
            document.getElementById("pDesc").value = data.desc || "";
            
            // Image
            document.getElementById("pUrl").value = data.image?.startsWith("data:") ? "" : (data.image || "");
            imagePreview.src = data.image || "images/all.png";
            currentImageBase64 = data.image?.startsWith("data:") ? data.image : "";

            // Datasheet
            document.getElementById("pPdfUrl").value = data.datasheet?.startsWith("data:") ? "" : (data.datasheet || "");
            currentPdfBase64 = data.datasheet?.startsWith("data:") ? data.datasheet : "";
            pdfNotice.textContent = data.datasheet ? "✔ Existing Datasheet attached" : "No Datasheet attached";

            document.getElementById("formTitle").textContent = "Edit Component";
            productModal.classList.add("active");
          }
        };
      });
    }

    document.getElementById("adminSearch").addEventListener("input", renderFilteredProducts);
    document.getElementById("adminCatFilter").addEventListener("change", renderFilteredProducts);

    // Save/Update Form Handler
    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.textContent = "Saving...";
      saveBtn.disabled = true;

      const editId = document.getElementById("editDocId").value;
      const finalImage = currentImageBase64 || pUrl.value.trim() || "images/all.png";
      const finalPdf = currentPdfBase64 || pPdfUrl.value.trim() || "";

      const payload = {
        name: document.getElementById("pName").value.trim(),
        price: parseFloat(document.getElementById("pPrice").value),
        qty: parseInt(document.getElementById("pQty").value) || 0,
        offer: document.getElementById("pOffer").value.trim(),
        category: document.getElementById("pCategory").value,
        image: finalImage,
        datasheet: finalPdf,
        keywords: document.getElementById("pKeywords").value.trim(),
        desc: document.getElementById("pDesc").value.trim(),
      };

      try {
        if (editId) {
          await updateDoc(doc(db, "products", editId), payload);
        } else {
          payload.outOfStock = false;
          payload.timestamp = Date.now();
          await addDoc(collection(db, "products"), payload);
        }
        productModal.classList.remove("active");
        loadProducts();
      } catch (err) {
        alert("Save Error: " + err.message);
      } finally {
        saveBtn.textContent = "Save Component";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
